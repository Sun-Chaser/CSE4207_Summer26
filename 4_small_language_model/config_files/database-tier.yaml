# Config Map
apiVersion: v1
kind: ConfigMap
metadata:
  name: slm-configmap
data:
  # Other pods can find this database using "slm-service:5432"
  DB_PORT: "5432"

---
# Database Service (needed for StatefulSet to have a stable network identity)
apiVersion: v1
kind: Service
metadata:
  name: slm-service
  labels:
    app: slm-database
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: slm-database

---
# Database APP
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: slm-database
  labels:
    app: slm-database
spec:
  serviceName: slm-service
  replicas: 1
  selector:
    matchLabels:
      app: slm-database
  template:
    metadata:
      labels:
        app: slm-database
    spec:
      containers:
        - name: slm-database
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            # Tell Postgres to initialize inside a subfolder rather than the raw mount root
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: slm-secret
            - configMapRef:
                name: slm-configmap
          volumeMounts:
            - name: my-volume-slm
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: my-volume-slm 
          persistentVolumeClaim:
            claimName: my-pvc-slm-db
