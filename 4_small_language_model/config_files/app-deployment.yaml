# Submitter APP Depolyment (Use #doc API for visualization)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slm-job-submitter
  namespace: default
  labels:
    app: slm-job-submitter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slm-job-submitter
  template:
    metadata:
      labels:
        app: slm-job-submitter
    spec:
      # Defined in rbac.yaml and authorized to create batch Jobs.
      serviceAccountName: slm-job-submitter
      containers:
        - name: app
          image: jackyang01/slm-api:latest
          imagePullPolicy: Always # Always pull the latest image for development purposes (IfNotPresent may have caching issues)
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JOB_TEMPLATE_DIR
              value: /app/job_templates # Path to the directory containing job templates (inside the container) Change this if Dockerfile is modified 
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Optional environment variables for job submission behavior
            - name: PYTHONUNBUFFERED # For debug purposes, real-time logging output to "kubectl logs"
              value: "1"
            - name: JOB_WAIT_TIMEOUT_SECONDS # Wait for job completion timeout in seconds (default: 30 seconds)
              value: "1800"
            - name: JOB_POLL_INTERVAL_SECONDS # Polling interval for job status check in seconds (default: 10 seconds)
              value: "2"
          # Optional health checks for the job submitter container
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Increase resource requests as needed (should be fine for small jobs)
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# Submitter Service (Optional, for internal communication)
apiVersion: v1
kind: Service
metadata:
  name: slm-job-submitter
  namespace: default
  labels:
    app: slm-job-submitter
spec:
  type: ClusterIP
  selector:
    app: slm-job-submitter
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
